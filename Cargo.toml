[package]
name = "rpgmdec"
version = "1.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "WTFPL"

[features]
system-fltk = ["fltk/system-fltk"]
system-png = ["fltk/system-libpng"]
system-jpeg = ["fltk/system-libjpeg"]
system-zlib = ["fltk/system-zlib"]
static-msvcrt = ["fltk/static-msvcrt"]

[dependencies]
cpal = { version = "0.18.2", features = ["realtime"] }
dirs = "7.0.0"
encoding_rs = "0.8.42"
fltk = { version = "1.5.23", features = ["use-ninja", "single-threaded"] }
fltk-theme = "0.7.9"
fontdue = { version = "0.9.4", features = ["parallel", "std"] }
gxhash = { version = "3.5.0", features = ["deterministic"] }
indexmap = "2.14.2"
phf = { version = "0.14.0", features = ["macros"] }
rayon = "1.12.0"
rpgmad-lib = { version = "6.0.0" }
rpgmasd = { package = "rpgm-asset-decrypter-lib", version = "4.0.0" }
strum_macros = "0.28.0"
symphonia = { version = "0.6.1", features = [
    "ogg",
    "isomp4",
    "aac",
    "vorbis",
    "opt-simd",
], default-features = false }
sys-locale = "0.3.2"
time = "0.3.55"
walkdir = "2.5.0"
webbrowser = { version = "1.2.4", features = ["disable-wsl", "hardened"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
lto = "fat"
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.release.build-override]
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
opt-level = 3
strip = "symbols"
